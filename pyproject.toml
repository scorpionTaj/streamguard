[project]
name = "streamguard"
version = "0.1.0"
description = "Real-time fraud detection: Kafka → Spark Structured Streaming → Redis online features → hybrid scoring → live alerts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Tajeddine Bourhim" }]
dependencies = [
    # contracts & config
    "pydantic>=2.8",
    "pyyaml>=6.0.1",
    # data
    "numpy>=2.0",
    "pandas>=2.2",
    "polars>=1.5",
    "pyarrow>=17.0",
    # streaming clients (producer, scorer consumer)
    "confluent-kafka>=2.4",
    "redis>=5.0",
    # serving & ui
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    # observability
    "prometheus-client>=0.20",
    # misc
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
train = [
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.48",
    "torch>=2.4",
    "mlflow>=2.16",
    "matplotlib>=3.9",
    "kaggle>=1.6",
    "jupyterlab>=4.2",
]
stream = [
    # only used inside the Spark container; never imported on the host
    "pyspark>=4.0,<5",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamguard"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "dashboard"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
