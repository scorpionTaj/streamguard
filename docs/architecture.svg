<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
    <style>
      .box { stroke-width: 1.5; rx: 8; }
      .host { fill: #eff6ff; stroke: #3b82f6; }
      .ctr { fill: #f0fdf4; stroke: #16a34a; }
      .ml { fill: #faf5ff; stroke: #7c3aed; }
      .title { font-weight: 700; font-size: 14px; fill: #0f172a; }
      .sub { fill: #475569; font-size: 12px; }
      .edge { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .offline { stroke: #7c3aed; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow-dash); }
      .label { fill: #334155; font-size: 11.5px; }
      .zone { fill: none; stroke: #94a3b8; stroke-dasharray: 4 4; rx: 12; }
    </style>
  </defs>
  <rect width="1100" height="600" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700" fill="#0f172a">StreamGuard — real-time fraud detection with an online feature store</text>

  <!-- docker compose zone -->
  <rect class="zone" x="300" y="58" width="560" height="200"/>
  <text x="312" y="76" class="sub">docker compose</text>

  <!-- online path, row 1 -->
  <rect class="box host" x="24" y="96" width="120" height="70"/>
  <text x="84" y="124" text-anchor="middle" class="title">IEEE-CIS</text>
  <text x="84" y="142" text-anchor="middle" class="sub">590,540 labeled tx</text>

  <rect class="box host" x="166" y="96" width="120" height="70"/>
  <text x="226" y="124" text-anchor="middle" class="title">Replay producer</text>
  <text x="226" y="142" text-anchor="middle" class="sub">TransactionDT clock</text>
  <text x="226" y="157" text-anchor="middle" class="sub">≤ 200 tx/s</text>

  <rect class="box ctr" x="318" y="96" width="150" height="70"/>
  <text x="393" y="122" text-anchor="middle" class="title">Redpanda</text>
  <text x="393" y="140" text-anchor="middle" class="sub">transactions.raw</text>
  <text x="393" y="155" text-anchor="middle" class="sub">3 partitions · key card_key</text>

  <rect class="box ctr" x="500" y="96" width="170" height="70"/>
  <text x="585" y="122" text-anchor="middle" class="title">Spark Streaming</text>
  <text x="585" y="140" text-anchor="middle" class="sub">structured · per-card state</text>
  <text x="585" y="155" text-anchor="middle" class="sub">5m · 1h · 24h · 7d velocity</text>

  <rect class="box ctr" x="702" y="96" width="140" height="70"/>
  <text x="772" y="122" text-anchor="middle" class="title">Redis 7</text>
  <text x="772" y="140" text-anchor="middle" class="sub">sg:card:* (latest, 7d)</text>
  <text x="772" y="155" text-anchor="middle" class="sub">sg:tx:* (per event, 10m)</text>

  <path class="edge" d="M144,131 H164"/>
  <path class="edge" d="M286,131 H316"/>
  <path class="edge" d="M468,131 H498"/>
  <path class="edge" d="M670,131 H700"/>

  <!-- observability inside compose -->
  <rect class="box ctr" x="318" y="190" width="150" height="54"/>
  <text x="393" y="213" text-anchor="middle" class="title">Prometheus</text>
  <text x="393" y="230" text-anchor="middle" class="sub">scrapes /metrics · 5 s</text>
  <rect class="box ctr" x="500" y="190" width="170" height="54"/>
  <text x="585" y="213" text-anchor="middle" class="title">Grafana</text>
  <text x="585" y="230" text-anchor="middle" class="sub">latency · lag · PSI · canary</text>
  <path class="edge" d="M468,217 H498"/>

  <!-- scorer -->
  <rect class="box host" x="880" y="96" width="196" height="150"/>
  <text x="978" y="120" text-anchor="middle" class="title">FastAPI scorer</text>
  <text x="978" y="140" text-anchor="middle" class="sub">consume raw → wait for the</text>
  <text x="978" y="155" text-anchor="middle" class="sub">event's own snapshot</text>
  <text x="978" y="172" text-anchor="middle" class="sub">offline-twin features</text>
  <text x="978" y="189" text-anchor="middle" class="sub">champion + challenger (canary)</text>
  <text x="978" y="206" text-anchor="middle" class="sub">risk bands · async SHAP</text>
  <text x="978" y="223" text-anchor="middle" class="sub">rolling PSI · /metrics</text>
  <path class="edge" d="M842,131 H878"/>
  <text x="846" y="122" class="label">HGETALL</text>
  <path class="edge" d="M468,108 C 620,70 820,70 900,94"/>
  <text x="640" y="74" class="label">transactions.raw (consumer group "scorer")</text>
  <path class="edge" d="M880,236 C 700,290 520,270 470,236"/>
  <text x="560" y="284" class="label">/metrics</text>

  <!-- outputs -->
  <rect class="box ctr" x="880" y="290" width="196" height="64"/>
  <text x="978" y="315" text-anchor="middle" class="title">Redpanda</text>
  <text x="978" y="333" text-anchor="middle" class="sub">transactions.scored · .alerts</text>
  <path class="edge" d="M978,246 V288"/>

  <rect class="box host" x="880" y="384" width="196" height="64"/>
  <text x="978" y="409" text-anchor="middle" class="title">Streamlit dashboard</text>
  <text x="978" y="427" text-anchor="middle" class="sub">feed · precision · drill-down</text>
  <path class="edge" d="M1076,180 C 1100,260 1100,360 1078,410"/>
  <text x="1030" y="372" class="label">/alerts</text>

  <!-- offline / MLOps -->
  <rect class="zone" x="24" y="330" width="830" height="250"/>
  <text x="36" y="350" class="sub">offline · MLOps (host)</text>

  <rect class="box ml" x="44" y="370" width="170" height="80"/>
  <text x="129" y="396" text-anchor="middle" class="title">Offline twin (polars)</text>
  <text x="129" y="414" text-anchor="middle" class="sub">features.yaml = single source</text>
  <text x="129" y="430" text-anchor="middle" class="sub">same velocity kernel as Spark</text>

  <rect class="box ml" x="250" y="370" width="190" height="80"/>
  <text x="345" y="396" text-anchor="middle" class="title">Training</text>
  <text x="345" y="414" text-anchor="middle" class="sub">XGBoost</text>
  <text x="345" y="430" text-anchor="middle" class="sub">temporal split · early stop on val</text>

  <rect class="box ml" x="476" y="370" width="190" height="80"/>
  <text x="571" y="396" text-anchor="middle" class="title">MLflow registry</text>
  <text x="571" y="414" text-anchor="middle" class="sub">champion · challenger aliases</text>
  <text x="571" y="430" text-anchor="middle" class="sub">promote gate · rollback</text>

  <rect class="box ml" x="44" y="484" width="396" height="70"/>
  <text x="242" y="510" text-anchor="middle" class="title">make parity · make bench · make drift</text>
  <text x="242" y="528" text-anchor="middle" class="sub">Redis vs offline (max |Δ| = 0) · per-hop latency · PSI vs train</text>

  <path class="offline" d="M214,410 H248"/>
  <path class="offline" d="M440,410 H474"/>
  <path class="offline" d="M666,410 C 760,410 860,300 900,250"/>
  <text x="700" y="372" class="label" fill="#7c3aed">models:/streamguard-scorer@champion</text>
  <path class="offline" d="M772,166 V519 H442"/>
  <text x="560" y="512" class="label" fill="#7c3aed">parity reads Redis</text>
</svg>
